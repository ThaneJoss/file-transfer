name: Cloudflare

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate full-stack Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build full-stack Worker in Workers Builds environment
        run: pnpm build
        env:
          WORKERS_CI: "1"

      - name: Validate deployment
        run: pnpm worker:dry-run

      - name: Worker integration tests
        run: pnpm test:worker

      - name: Check generated bindings
        run: pnpm worker:types:check
