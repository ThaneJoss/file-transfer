packages:
  - "."

# Miniflare 4 pins these vulnerable versions; keep its API while applying
# compatible security patches until the test pool supports a stable upgrade.
overrides:
  "undici@7.28.0": "7.29.1"
  "sharp@0.35.2": "0.35.5"

allowBuilds:
  esbuild: true
  msw: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260723.1"
  - "miniflare@4.20260721.0"
  - "wrangler@4.113.0"
